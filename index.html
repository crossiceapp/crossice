<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<meta name="apple-mobile-web-app-title" content="CrossIce">
<title>CrossIce</title>
<style>
:root{--bg:#f1efe8;--surface:#ffffff;--border:rgba(0,0,0,.18);--text:#1a1a18;--text2:#5f5e5a;--accent-bg:#E6F1FB;--accent-text:#0C447C;--danger:#A32D2D;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--surface:#2a2a27;--border:rgba(255,255,255,.2);--text:#f1efe8;--text2:#b4b2a9;--accent-bg:#0C447C;--accent-text:#B5D4F4;--danger:#F09595;}}
:root[data-theme="dark"]{--bg:#1c1c1a;--surface:#2a2a27;--border:rgba(255,255,255,.2);--text:#f1efe8;--text2:#b4b2a9;--accent-bg:#0C447C;--accent-text:#B5D4F4;--danger:#F09595;}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text;font:inherit;color:var(--text);background:var(--surface);border:.5px solid var(--border);border-radius:3px;height:32px;padding:0 8px;box-sizing:border-box;width:100%}
#box{position:absolute;inset:0;background:var(--bg);--barT:calc(46px + env(safe-area-inset-top,0px));--barB:calc(46px + env(safe-area-inset-bottom,0px))}
body.bars-off #box{--barT:env(safe-area-inset-top,0px);--barB:0px}
#rink{position:absolute;left:0;top:var(--barT);width:100%;height:calc(100% - var(--barT) - var(--barB));display:block;touch-action:none;transition:top .15s,height .15s}
#ink{pointer-events:none}
button{font:inherit;color:var(--text);background:var(--surface);border:.5px solid var(--border);border-radius:3px;height:32px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;min-width:0}
button svg{flex:none}
.ui{transition:opacity .12s}
#topbar{position:absolute;top:0;left:0;right:0;z-index:4;
  padding:calc(7px + env(safe-area-inset-top,0px)) calc(7px + env(safe-area-inset-right,0px)) 7px calc(7px + env(safe-area-inset-left,0px));
  display:flex;justify-content:space-between;align-items:center;
  background:var(--bg);border-bottom:.5px solid var(--border);pointer-events:auto;transition:transform .15s}
body.bars-off #topbar{transform:translateY(-110%);pointer-events:none}
#topbar button{pointer-events:auto}
#botbar{position:absolute;bottom:0;left:0;right:0;z-index:4;
  padding:7px calc(7px + env(safe-area-inset-right,0px)) calc(7px + env(safe-area-inset-bottom,0px)) calc(7px + env(safe-area-inset-left,0px));
  display:flex;justify-content:center;align-items:center;
  background:var(--bg);border-top:.5px solid var(--border);pointer-events:auto;transition:transform .15s}
body.bars-off #botbar{transform:translateY(110%);pointer-events:none}
#barTab{position:absolute;z-index:3;left:50%;margin-left:-22px;top:var(--barT);
  width:44px;height:19px;padding:0;border-radius:0 0 9px 9px;border-top:none;
  background:var(--bg);color:var(--text2);display:flex;align-items:center;justify-content:center;
  pointer-events:auto;transition:top .15s}
#barTab span{display:flex;transform:rotate(180deg);transition:transform .15s}
body.bars-off #barTab span{transform:rotate(0)}
#botbar button{pointer-events:auto}
#status{position:absolute;left:7px;bottom:7px;font-size:12px;color:var(--text2);background:var(--surface);border:.5px solid var(--border);border-radius:3px;padding:6px 8px;pointer-events:auto;max-width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.sq{width:32px;padding:0}
.pop{position:absolute;top:calc(47px + env(safe-area-inset-top,0px));background:var(--surface);border:.5px solid var(--border);border-radius:4px;padding:6px;display:none;z-index:5}
#pTools{left:calc(6px + env(safe-area-inset-left,0px));width:min(340px,calc(100% - 12px))}
#pColor{left:calc(6px + env(safe-area-inset-left,0px))}
#pIce{left:calc(6px + env(safe-area-inset-left,0px));right:calc(6px + env(safe-area-inset-right,0px));max-width:340px}
#pMore{right:calc(6px + env(safe-area-inset-right,0px));width:200px}
#pSave{left:calc(6px + env(safe-area-inset-left,0px));right:calc(6px + env(safe-area-inset-right,0px));max-width:340px}
#pIcons{top:auto;bottom:calc(46px + env(safe-area-inset-bottom,0px));left:calc(6px + env(safe-area-inset-left,0px));right:calc(6px + env(safe-area-inset-right,0px));max-height:55%;overflow-y:auto;touch-action:pan-y}
.row{display:flex;gap:3px}
.row>button{flex:1}
.row.wr{flex-wrap:wrap;row-gap:4px}
.chiprow{flex:1;min-width:0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:1px}
.chiprow::-webkit-scrollbar{display:none}
.chiprow>button{flex:none;white-space:nowrap}
.row.wr>button{flex:1 1 auto}
.tb{flex:1;height:auto!important;padding:4px 2px;flex-direction:column;gap:2px;font-size:11px}
.sw{width:28px;height:28px;padding:0;border:none}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.pt{padding:0;height:auto;background:#F4F9FD;line-height:0;min-width:0;width:100%}
.pt svg{width:100%;height:auto;display:block}
.cap{font-size:12px;color:var(--text2);text-align:center;margin:3px 0 0;line-height:1.2}
.menu{justify-content:flex-start;width:100%;margin-top:3px}
#lib{position:absolute;inset:0;background:var(--bg);overflow-y:auto;display:none;z-index:20;touch-action:pan-y;padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 40px calc(12px + env(safe-area-inset-left,0px))}
#lib .inner{max-width:560px;margin:0 auto}
.lrow{display:flex;align-items:center;gap:8px}
.it{display:flex;gap:10px;align-items:center;padding:8px;border:.5px solid var(--border);border-radius:4px;margin-top:6px;cursor:pointer;background:var(--surface)}
.it.on{background:var(--accent-bg)}
.nm{font-size:14px;font-weight:500}
.meta{font-size:12px;color:var(--text2);margin-top:2px}
.mid{flex:1;min-width:0}
.bd{width:22px;height:22px;border-radius:50%;background:#185FA5;color:#fff;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:none}
.note{font-size:12px;color:var(--text2);margin:8px 0 0;line-height:1.4}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.err{color:var(--danger)}
symbol{overflow:visible}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(-5px,1px)}35%{transform:translate(5px,-1px)}55%{transform:translate(-4px,-1px)}75%{transform:translate(4px,1px)}}
#rink.shake{animation:shake .4s}
#hint{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--accent-bg);color:var(--accent-text);border:.5px solid var(--border);border-radius:3px;padding:6px 10px;font-size:13px;display:none;z-index:6;pointer-events:none;white-space:nowrap}
textarea{-webkit-user-select:text;user-select:text;font:inherit;color:var(--text);background:var(--surface);border:.5px solid var(--border);border-radius:3px;box-sizing:border-box}
@page{margin:10mm}
#info{position:absolute;left:calc(6px + env(safe-area-inset-left,0px));right:calc(6px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));max-height:46%;overflow-y:auto;background:var(--surface);border:.5px solid var(--border);border-radius:4px;padding:10px;z-index:8;display:none;touch-action:pan-y}
@media (orientation:landscape){#info{left:auto;right:calc(6px + env(safe-area-inset-right,0px));top:calc(44px + env(safe-area-inset-top,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));width:min(320px,42%);max-height:none}}
#pins{position:absolute;left:calc(6px + env(safe-area-inset-left,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));max-width:52%;background:var(--surface);border:.5px solid var(--border);border-left:3px solid #EF9F27;border-radius:3px;padding:6px 8px;font-size:12px;line-height:1.45;z-index:3;display:none;pointer-events:none;opacity:.94}
#pins b{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);font-weight:500;margin-bottom:2px}
#pins div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pdoc{display:none}
#sheet{position:absolute;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
#sheetBar{display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;flex-wrap:wrap}
#shName{font-size:13px;flex:1;min-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheetBody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px 12px}
#sheetBody svg{max-width:100%;max-height:100%}
#shMsg{font-size:12px;color:var(--text2);padding:0 10px 8px}
#shTabs{display:flex;gap:4px;flex-wrap:wrap;padding:0 10px 8px}
#shTabs button{height:30px;min-width:34px;font-size:13px}
#shInfo{padding:0 10px 8px;font-size:13px;line-height:1.45;max-height:30%;overflow-y:auto}
#shInfo .kpl{color:var(--text2);font-size:12px}
#mvbar{position:absolute;bottom:calc(54px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;background:var(--surface);border:.5px solid var(--border);border-left:3px solid #EF9F27;border-radius:3px;padding:5px 6px 5px 9px;font-size:12px;z-index:7;max-width:calc(100% - 24px)}
#mvbar button{height:28px;font-size:12px}
.kp{margin:6px 0 0;padding-left:18px}
.kp li{margin:2px 0}
.dchip{font-size:12px;color:var(--text2);font-weight:400;margin-left:6px}
@page{size:portrait;margin:17mm 13mm}
@media print{body>*{display:none!important}
#phdr,#pftr{position:fixed;left:0;right:0;font-style:italic;font-size:11px;line-height:1.45;color:#000}
#phdr{top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
#pftr{bottom:0}
#phdr b,#pftr b{font-weight:600;font-style:normal}
#phdr img{height:36px;width:auto;flex:none}
.pblk{page-break-after:always;break-after:page;padding:46px 0 34px}
.pblk:last-child{page-break-after:auto;break-after:auto}
.pcover{text-align:center}
.pcover svg{margin:0 auto}
.prow{display:flex;gap:20px;align-items:flex-start}
.phalf{display:flex;gap:18px;align-items:flex-start;height:380px;overflow:hidden}
.phalf+.phalf{border-top:.5px solid #ccc;margin-top:13px;padding-top:13px}
.phalf .ptxt{flex:1;min-width:0}
.phalf svg{flex:none}
.ptitle{margin:0 0 10px}
.pcol{flex:1;min-width:0}
.prow svg{flex:none}
.pcol p:first-of-type,.pcol ul:first-of-type{margin-top:7px}.ui,.pop,#trash,#lib,#hint,#info,#pins,#box{display:none!important}html,body{height:auto;overflow:visible;background:#fff;color:#000}#pdoc{display:block!important}
.pblk{page-break-inside:avoid;break-inside:avoid;margin:0 0 22px}
.pblk h2{font-size:15px;margin:0 0 2px;font-weight:600}
.pblk .pm{font-size:11px;color:#555;margin:0 0 6px}
.pblk ul{margin:7px 0 0;padding-left:18px;font-size:12px}
.pblk p{font-size:12px;line-height:1.5;margin:7px 0 0;white-space:pre-wrap}
#pdoc h1{font-size:18px;margin:0 0 3px}
#pdoc .ph{font-size:11px;color:#555;margin:0 0 14px}}
#trash{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border:2px dashed var(--danger);border-radius:4px;background:var(--surface);color:var(--danger);display:none;align-items:center;justify-content:center;z-index:4;pointer-events:none}
</style>
</head>

function tagName(k){for(var i=0;i<ALLTAGS.length;i++)if(ALLTAGS[i][0]===k)return ALLTAGS[i][1];return k;}
function isLvl(k){return LVLK.indexOf(k)>=0;}
function hasLvl(d){return (d.tags||[]).some(isLvl);}
function autoTags(d){
  var txt=((d.name||'')+' '+((d.snap&&d.snap.desc)||'')).toLowerCase(), out=[];
  TAGS.forEach(function(t){
    var ws=TAGW[t[0]]||[];

  });
  return out;
}

/* ---------- lines ---------- */
var PEN='#141414', PENW=0.25;
function smooth1(p){
  if(p.length<3)return p;
  var q=[p[0]];
  for(var i=1;i<p.length-1;i++)q.push([(p[i-1][0]+p[i][0]+p[i+1][0])/3,(p[i-1][1]+p[i][1]+p[i+1][1])/3]);
  q.push(p[p.length-1]);return q;
}
function smooth(p){
  for(var k=0;k<3;k++){var q=[p[0]];for(var i=1;i<p.length-1;i++)q.push([(p[i-1][0]+p[i][0]+p[i+1][0])/3,(p[i-1][1]+p[i][1]+p[i+1][1])/3]);q.push(p[p.length-1]);p=q;}
  return p;
}
function resample(p,step){
  var out=[p[0]],prevp=p[0],d=0;
  for(var i=1;i<p.length;i++){
    var seg=dist(prevp,p[i]);
    while(seg>0&&d+seg>=step){var t=(step-d)/seg;var np=[prevp[0]+(p[i][0]-prevp[0])*t,prevp[1]+(p[i][1]-prevp[1])*t];out.push(np);prevp=np;seg=dist(prevp,p[i]);d=0;}
    d+=seg;prevp=p[i];
  }
  if(dist(out[out.length-1],p[p.length-1])>0.05)out.push(p[p.length-1]);
  return out;
}
function nrm(a,i){var p=a[Math.max(0,i-1)],q=a[Math.min(a.length-1,i+1)];var dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1;return [-dy/l,dx/l];}
function pstr(a){return a.map(function(p){return p[0].toFixed(2)+','+p[1].toFixed(2);}).join(' ');}
function offs(a,f){return a.map(function(p,i){var n=nrm(a,i),o=f(i);return [p[0]+n[0]*o,p[1]+n[1]*o];});}
function shotOff(s){var H=2.4,F=0.6;if(s>H+F)return 0.5;if(s>H)return 0.5+0.8*((H+F-s)/F);return 1.3*s/H;}
function build(l){
  var a=l.arr,n=a.length,g=el('g',{});

  if(l.sel)g.appendChild(el('polyline',{points:pstr(a),fill:'none',stroke:'#378ADD','stroke-width':2.6,opacity:0.3,'stroke-linecap':'round','stroke-linejoin':'round'}));
  var attrs=Object.assign({},base);
  if(l.type==='skate'||l.type==='back'){attrs.points=pstr(a);g.appendChild(el('polyline',attrs));}
  if(l.type==='back'){
    var d='';for(var i=8;i<n-6;i+=9){var nr=nrm(a,i);d+='M'+(a[i][0]-nr[0]*0.8).toFixed(2)+' '+(a[i][1]-nr[1]*0.8).toFixed(2)+'L'+(a[i][0]+nr[0]*0.8).toFixed(2)+' '+(a[i][1]+nr[1]*0.8).toFixed(2);}
    if(d)g.appendChild(el('path',Object.assign({},base,{d:d})));
  }
  if(l.type==='puck'){
    var w=offs(a,function(i){var taper=Math.min(1,i/10,(n-1-i)/10);return 0.6*taper*Math.sin(i*0.4/4.2*2*Math.PI);});

  }
  if(l.type==='pen'){attrs.points=pstr(a);attrs['stroke-width']=PENW;g.appendChild(el('polyline',attrs));return g;}
  if(l.type==='pass'){attrs.points=pstr(a);attrs['stroke-dasharray']='1.3 1.2';g.appendChild(el('polyline',attrs));}
  if(l.type==='shot'){
    var th=Object.assign({},base,{'stroke-width':0.35});
    th.points=pstr(offs(a,function(i){return shotOff((n-1-i)*l.step);}));g.appendChild(el('polyline',Object.assign({},th)));

    }

svg.addEventListener('pointermove',function(e){

function up(e){
  if(e.pointerId!==act)return;
  act=null;hideUI(false);
  if(raw){
    ink.removeChild(prev);prev=null;
    var len=0;for(var i=1;i<raw.length;i++)len+=dist(raw[i-1],raw[i]);
    var arr=null,step=(ptype==='pen')?0.25:0.4;
    if(len>=(ptype==='pen'?0.5:3)&&raw.length>1){
      if(ptype==='pen'){arr=resample(smooth1(raw),step);}
      else if(ptype==='shot'){step=0.2;arr=resample([raw[0],raw[raw.length-1]],step);}
      else if(ptype==='pass'){arr=resample([raw[0],raw[raw.length-1]],step);}
      else if(raw.length>2)arr=resample(smooth(resample(raw,0.8)),step);
    }
    if(arr&&arr.length>(ptype==='pen'?1:3)){
      var l={type:ptype,color:(ptype==='pen'?PEN:color),arr:arr,step:step,sel:false,g:null};
      lines.push(l);redraw(l);
      hist.push({undo:function(){var k=lines.indexOf(l);if(k>=0)lines.splice(k,1);if(l.g&&l.g.parentNode)ink.removeChild(l.g);}});
      dirty();
    }
    raw=null;return;
  }
  if(drag){
    var d=drag;drag=null;
    if(d.m==='lmv'){if(d.dx||d.dy){hist.push({undo:function(){d.l.arr=d.l.arr.map(function(q){return [q[0]-d.dx,q[1]-d.dy];});redraw(d.l);}});dirty();}}
    else if(d.m==='imv'){
      trashEl.style.display='none';
      if(overTrash){overTrash=false;d.it.x=d.x0;d.it.y=d.y0;removeIcon(d.it.id);return;}
      if(d.dist<0.8){lastTap={id:d.it.id,t:e.timeStamp};}
      else{hist.push({undo:function(){d.it.x=d.x0;d.it.y=d.y0;render();}});dirty();}
    } else if(d.m==='irot'){
      if(d.it.a!==d.a){hist.push({undo:function(){d.it.a=d.a;render();}});dirty();}
    } else if(d.m==='gmv'){
      if(d.dx||d.dy){
        var gdx=d.dx,gdy=d.dy;
        hist.push({undo:function(){moveSel(-gdx,-gdy);render();}});
        dirty();
      }

      endBox();
      var bx0=Math.min(d.x0,d.x1),bx1=Math.max(d.x0,d.x1),by0=Math.min(d.y0,d.y1),by1=Math.max(d.y0,d.y1);
      if(bx1-bx0>=1.2||by1-by0>=1.2){
        var r=[bx0,by0,bx1-bx0,by1-by0],bn=0;
        items.forEach(function(i){i.sl=inRect(r,i.x,i.y);if(i.sl)bn++;});
        lines.forEach(function(l){
          var all=l.arr.every(function(q){return inRect(r,q[0],q[1]);});
          if(l.sel!==all){l.sel=all;redraw(l);}
          if(all)bn++;

        sel=null;
        statusMsg(bn?(bn+' selected \u2014 drag any of them to move the lot'):'Nothing inside the box');
      }
    }
    render();
  }
}

/* ---------- save a drill ---------- */
/* A drill is what sits inside the section you are looking at, so six drills
   laid out across one sheet save as six separate drills, not six copies of
   the whole sheet. A line belongs to the section its midpoint falls in. */
function inRect(v,x,y){return x>=v[0]-0.01&&x<=v[0]+v[2]+0.01&&y>=v[1]-0.01&&y<=v[1]+v[3]+0.01;}
function snapIn(m,k,fresh){
  var sn=snap(), v=views[m]&&views[m][k];
  if(!v)return sn;
  sn.lines=sn.lines.filter(function(l){
    var cx=0,cy=0;l.arr.forEach(function(p){cx+=p[0];cy+=p[1];});
    return inRect(v,cx/l.arr.length,cy/l.arr.length);
  });
  sn.items=sn.items.filter(function(i){return inRect(v,i.x,i.y);});
  sn.mode=m;sn.sub=k;
  if(fresh){sn.home={m:m,s:k};sn.xf={ax:1,ay:1,bx:0,by:0};}
  return sn;
}
function sectionSnap(){
  if(mode==='full'||!views[mode]||!views[mode][sub])return snap();
  return snapIn(mode,sub,false);
}
/* Looking at the whole sheet and tapping Save used to store the drill as a
   full-ice drill even when everything drawn sat inside one section — the
   drill was not stretched, it was just filed as a full sheet. Work out the
   tightest section that holds it all and offer that instead. */
function tightFit(){
  var b=contentBox(lines,items); if(!b)return null;
  var best=null, ba=1e9;
  ['sixth','quarter','center','half'].forEach(function(m){
    Object.keys(views[m]).forEach(function(k){
      var v=views[m][k], e=0.6;
      if(b[0]>=v[0]-e&&b[0]+b[2]<=v[0]+v[2]+e&&b[1]>=v[1]-e&&b[1]+b[3]<=v[1]+v[3]+e){
        var a=v[2]*v[3]; if(a<ba){ba=a;best={m:m,k:k};}
      }
    });
  });
  return best;
}
function fitText(f){
  if(!f)return '';
  if(f.m==='center')return 'Center ice';
  if(f.m==='sixth')return 'Sixth \u00b7 '+f.k;
  return (f.m==='half'?'Half \u00b7 ':'Quarter \u00b7 ')+f.k;
}
var svFit=null, svFull=false;
function saveSnap(){
  if(mode==='full'&&svFit&&!svFull){
    var sn=snapIn(svFit.m,svFit.k,false);
    if(!(sn.home&&sn.home.m===sn.mode&&sn.home.s===sn.sub)){sn.home={m:sn.mode,s:sn.sub};sn.xf=idXf();}
    return sn;
  }
  return sectionSnap();
}
function saveWhere(){return (mode==='full'&&svFit&&!svFull)?fitText(svFit):chipText();}
function svRender(){
  var sn=saveSnap(), nl=sn.lines.length, ni=sn.items.length;
  document.getElementById('svNote').textContent=
    'Saves the '+nl+' line'+(nl===1?'':'s')+' and '+ni+' icon'+(ni===1?'':'s')+' inside '+saveWhere()
    +(sn.mode==='full'?'.':'. Anything on the rest of the ice is left out.')
    +(DB.src&&ctx.k==='draft'?' This draft is a copy of “'+DB.src+'”, so pick a different name.':'');
  var row=document.getElementById('svFit');
  if(mode==='full'&&svFit){
    var on='style="background:var(--accent-bg);color:var(--accent-text)"';
    row.style.display='block';
    row.innerHTML='<p class="note" style="margin:0 0 4px">Everything you have drawn sits inside <b>'+esc(fitText(svFit))+'</b>. Saved that way it can still be moved to any other section later.</p>'+
      '<div class="btns"><button data-sv="sec" '+(svFull?'':on)+'>'+esc(fitText(svFit))+'</button><button data-sv="full" '+(svFull?on:'')+'>Whole sheet</button></div>';
  } else {row.style.display='none';row.innerHTML='';}
}
/* Split whatever is on the board into a plan, one section at a time, so a
   sheet drawn on the fly becomes a practice plan without saving six drills. */
function planFromBoard(lk){
  var L=PLANL[lk]; if(!L)return null;
  var np={id:uid(),name:stamp(),layout:lk,date:todayStr(),team:DB.team||'',focus:'',equip:'',slots:emptySlots(L)}, n=0;
  L.keys.forEach(function(k,i){
    var sn=snapIn(L.m,k,true);
    if(!sn.lines.length&&!sn.items.length)return;
    np.slots[i]={src:null,name:'Drill '+(i+1),mod:true,snap:sn};n++;
  });
  if(!n)return null;

}
function nameTaken(n,except){return DB.drills.some(function(d){return d.id!==except&&d.name.trim().toLowerCase()===n.trim().toLowerCase();});}

/* ---------- thumbnails ---------- */
/* `pad` is the breathing room left around the ice, in feet. A standalone
   thumbnail wants a little; the cells of a plan map want none, or each piece
   is drawn slightly smaller than its box and the ice no longer tiles - which
   reads as the whole surface having shrunk by the width of a divider. */
function snapThumb(s,x,y,w,h,portrait,pad){
  var v=views[s.mode]&&views[s.mode][s.sub]?views[s.mode][s.sub]:views.full['Whole sheet'];
  var vx=v[0],vy=v[1],vw=v[2],vh=v[3],m=(pad===undefined?1:pad);
  var rot=portrait;
  var vb=rot?[vy,-(vx+vw),vh,vw]:[vx,vy,vw,vh];
  var o='<svg x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" viewBox="'+(vb[0]-m)+' '+(vb[1]-m)+' '+(vb[2]+2*m)+' '+(vb[3]+2*m)+'" style="display:block;flex:none"><g'+(rot?' transform="rotate(-90)"':'')+'><use href="#rinkg"/>';
  s.items.forEach(function(i){o+='<g transform="'+itemXf(i,rot?-90:0)+'"'+(i.col?' style="color:'+i.col+'"':'')+'><use href="#'+T[i.t].s+'" width="56" height="56"/></g>';});
  s.lines.forEach(function(l){o+='<polyline points="'+pstr(l.arr)+'" fill="none" stroke="'+l.color+'" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>';});
  return o+'</g></svg>';
}
function tsvg(s,w,h){return '<svg width="'+w+'" height="'+h+'" style="flex:none;display:block">'+snapThumb(s,0,0,w,h,false)+'</svg>';}

function startRename(t){
  var k=t.dataset.k,id=t.dataset.id;
  var obj=(k==='p')?getPlan(id):(k==='s')?((getPlan(id)||{slots:[]}).slots[+t.dataset.i]):getDrill(id);
  if(!obj)return;
  var inp=document.createElement('input');inp.value=obj.name;inp.maxLength=60;
  t.replaceWith(inp);inp.focus();inp.select();
  var done=false;
  function commit(){
    if(done)return;done=true;
    var n=inp.value.trim();
    if(n&&(k!=='d'||!nameTaken(n,obj.id)))obj.name=n;
    persist();renderLib();
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')commit();if(e.key==='Escape'){done=true;renderLib();}});
  inp.addEventListener('click',function(e){e.stopPropagation();});
}
libIn.addEventListener('click',function(e){

/* Which end of the rink a section belongs to: -1 west/north, +1 east/south,
   0 if it straddles the middle (centre ice, the middle sixths, full ice). */
function endSign(r,ax){
  var lo=r[ax], hi=r[ax]+r[ax+2], mid=ax?42.5:100, e=0.5;

  hist.push({undo:function(){
    dXf=oldX;
    lines.forEach(function(l,k){if(oldL[k]){l.arr=oldL[k];redraw(l);}});
    items.forEach(function(i,k){if(oldI[k]){i.x=oldI[k][0];i.y=oldI[k][1];i.a=oldI[k][2];i.f=oldI[k][3];}});
    render();
  }});
  render();dirty();
};
/* ---------- full screen ---------- */
function fsNote(){document.getElementById('status').textContent='Full screen isn\u2019t available in this view. The installed app will be full screen.';}
document.getElementById('fs').onclick=function(){closeAll();var d=document;try{if(d.fullscreenElement){d.exitFullscreen();}else if(d.documentElement.requestFullscreen){d.documentElement.requestFullscreen({navigationUI:'hide'}).catch(fsNote);}else fsNote();}catch(e){fsNote();}};
/* ---------- club drills ----------
   A drills.json uploaded next to the app becomes the starter library: a coach
   who installs gets the club's drills without importing anything, and they
   arrive locked so nobody edits the shared copies by accident.
   Running again only ADDS. A drill whose name is already in the library is
   left alone, so a coach never loses their own work when the club file
   is updated. Every export stamps itself, so a newer file is picked up and
   an older one is ignored — there is no version number to remember. */
function seedDrills(){
  if(location.protocol.indexOf('http')!==0)return;
  fetch('./drills.json',{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(o){
      if(!o||!Array.isArray(o.drills))return;
      var ver=+o.seed||1;
      if((+DB.seed||0)>=ver)return;
      var added=0;
      o.drills.forEach(function(d){
        if(!d||!d.snap||!Array.isArray(d.snap.lines)||!Array.isArray(d.snap.items))return;
        var name=String(d.name||'').trim().slice(0,60);
        if(!name||nameTaken(name))return;
        DB.drills.push({id:uid(),name:name,saved:d.saved||stamp(),core:true,
                        tags:okTags(d.tags),fav:false,snap:fixIncoming(cleanSnap(d.snap),o.subv)});
        added++;
      });
      DB.seed=ver;
      DB.drills.forEach(function(d){brightenSnap(d.snap);});
      autoTagAll();persist();
      if(added){statusMsg(added+' club drill'+(added===1?'':'s')+' added');
        if(lib.style.display==='block')renderLib();}
    })
    .catch(function(){});
}

document.getElementById('barTab').onclick=function(){
  var off=document.body.classList.toggle('bars-off');
  this.setAttribute('aria-label',off?'Show the toolbars':'Hide the toolbars');
  DB.barsOff=off;persist();
};

/* ---------- start ---------- */
loadDB();
drawIcons();syncPen();
if(DB.barsOff){document.body.classList.add('bars-off');
  document.getElementById('barTab').setAttribute('aria-label','Show the toolbars');}
seedDrills();
if(DB.draft)loadSnap(DB.draft);else paint();
ui();setStatus();drawPins();
</script>
<script>
/* Register the service worker so the app installs to the home screen and
   opens with no signal. Harmless anywhere sw.js is not served. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
  /* Cache-first means the copy on screen is the one that was already stored,
     so without this a new version would only appear on the launch after next.
     When a new worker takes over, reload once and show it straight away. The
     draft is written to storage continuously, so nothing in progress is lost.
     Only armed when a worker is already in charge, otherwise the very first
     visit would reload itself for no reason. */
  if (navigator.serviceWorker.controller) {
    var swReloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (swReloading) return;
      swReloading = true;
      location.reload();
    });
  }
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js').catch(function () {});
  });
}
</script>
