<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./favicon-64.png">
<meta name="application-name" content="CrossIce">
<meta name="apple-mobile-web-app-title" content="CrossIce">
<title>CrossIce</title>
<style>
:root{--bg:#f1efe8;--surface:#ffffff;--border:rgba(0,0,0,.18);--text:#1a1a18;--text2:#5f5e5a;--accent-bg:#E6F1FB;--accent-text:#0C447C;--danger:#A32D2D;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1c1a;--surface:#2a2a27;--border:rgba(255,255,255,.2);--text:#f1efe8;--text2:#b4b2a9;--accent-bg:#0C447C;--accent-text:#B5D4F4;--danger:#F09595;}}
:root[data-theme="dark"]{--bg:#1c1c1a;--surface:#2a2a27;--border:rgba(255,255,255,.2);--text:#f1efe8;--text2:#b4b2a9;--accent-bg:#0C447C;--accent-text:#B5D4F4;--danger:#F09595;}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
input{-webkit-user-select:text;user-select:text;font:inherit;color:var(--text);background:var(--surface);border:.5px solid var(--border);border-radius:3px;height:32px;padding:0 8px;box-sizing:border-box;width:100%}
#box{position:absolute;inset:0;background:var(--bg)}
#rink{width:100%;height:100%;display:block;touch-action:none}
#ink{pointer-events:none}
button{font:inherit;color:var(--text);background:var(--surface);border:.5px solid var(--border);border-radius:3px;height:32px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;min-width:0}
button svg{flex:none}
.ui{transition:opacity .12s}
#topbar{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:calc(6px + env(safe-area-inset-left,0px));right:calc(6px + env(safe-area-inset-right,0px));display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#topbar button{pointer-events:auto}
#botbar{position:absolute;bottom:calc(6px + env(safe-area-inset-bottom,0px));left:calc(6px + env(safe-area-inset-left,0px));right:calc(6px + env(safe-area-inset-right,0px));display:flex;justify-content:center;pointer-events:none}
#botbar button{pointer-events:auto}
#status{position:absolute;left:0;bottom:0;font-size:12px;color:var(--text2);background:var(--surface);border:.5px solid var(--border);border-radius:3px;padding:6px 8px;pointer-events:auto;max-width:38%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.sq{width:32px;padding:0}
.pop{position:absolute;top:calc(44px + env(safe-area-inset-top,0px));background:var(--surface);border:.5px solid var(--border);border-radius:4px;padding:6px;display:none;z-index:5}
#pTools{left:calc(6px + env(safe-area-inset-left,0px));width:min(340px,calc(100% - 12px))}
#pColor{left:calc(6px + env(safe-area-inset-left,0px))}
#pIce{left:calc(6px + env(safe-area-inset-left,0px));right:calc(6px + env(safe-area-inset-right,0px));max-width:340px}
#pMore{right:calc(6px + env(safe-area-inset-right,0px));width:200px}
#pSave{left:calc(6px + env(safe-area-inset-left,0px));right:calc(6px + env(safe-area-inset-right,0px));max-width:340px}
#pIcons{top:auto;bottom:calc(46px + env(safe-area-inset-bottom,0px));left:calc(6px + env(safe-area-inset-left,0px));right:calc(6px + env(safe-area-inset-right,0px));max-height:55%;overflow-y:auto;touch-action:pan-y}
.row{display:flex;gap:3px}
.row>button{flex:1}
.tb{flex:1;height:auto!important;padding:4px 2px;flex-direction:column;gap:2px;font-size:11px}
.sw{width:28px;height:28px;padding:0;border:none}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.pt{padding:0;height:auto;background:#F4F9FD;line-height:0;min-width:0;width:100%}
.pt svg{width:100%;height:auto;display:block}
.cap{font-size:12px;color:var(--text2);text-align:center;margin:3px 0 0;line-height:1.2}
.menu{justify-content:flex-start;width:100%;margin-top:3px}
#lib{position:absolute;inset:0;background:var(--bg);overflow-y:auto;display:none;z-index:20;touch-action:pan-y;padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 40px calc(12px + env(safe-area-inset-left,0px))}
#lib .inner{max-width:560px;margin:0 auto}
.lrow{display:flex;align-items:center;gap:8px}
.it{display:flex;gap:10px;align-items:center;padding:8px;border:.5px solid var(--border);border-radius:4px;margin-top:6px;cursor:pointer;background:var(--surface)}
.it.on{background:var(--accent-bg)}
.nm{font-size:14px;font-weight:500}
.meta{font-size:12px;color:var(--text2);margin-top:2px}
.mid{flex:1;min-width:0}
.bd{width:22px;height:22px;border-radius:50%;background:#185FA5;color:#fff;font-size:12px;font-weight:500;display:flex;align-items:center;justify-content:center;flex:none}
.note{font-size:12px;color:var(--text2);margin:8px 0 0;line-height:1.4}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.err{color:var(--danger)}
symbol{overflow:visible}
@keyframes shake{0%,100%{transform:translate(0,0)}15%{transform:translate(-5px,1px)}35%{transform:translate(5px,-1px)}55%{transform:translate(-4px,-1px)}75%{transform:translate(4px,1px)}}
#rink.shake{animation:shake .4s}
#hint{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--accent-bg);color:var(--accent-text);border:.5px solid var(--border);border-radius:3px;padding:6px 10px;font-size:13px;display:none;z-index:6;pointer-events:none;white-space:nowrap}
textarea{-webkit-user-select:text;user-select:text;font:inherit;color:var(--text);background:var(--surface);border:.5px solid var(--border);border-radius:3px;box-sizing:border-box}
@page{margin:10mm}
#info{position:absolute;left:calc(6px + env(safe-area-inset-left,0px));right:calc(6px + env(safe-area-inset-right,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));max-height:46%;overflow-y:auto;background:var(--surface);border:.5px solid var(--border);border-radius:4px;padding:10px;z-index:8;display:none;touch-action:pan-y}
@media (orientation:landscape){#info{left:auto;right:calc(6px + env(safe-area-inset-right,0px));top:calc(44px + env(safe-area-inset-top,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));width:min(320px,42%);max-height:none}}
#pins{position:absolute;left:calc(6px + env(safe-area-inset-left,0px));bottom:calc(46px + env(safe-area-inset-bottom,0px));max-width:52%;background:var(--surface);border:.5px solid var(--border);border-left:3px solid #EF9F27;border-radius:3px;padding:6px 8px;font-size:12px;line-height:1.45;z-index:3;display:none;pointer-events:none;opacity:.94}
#pins b{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);font-weight:500;margin-bottom:2px}
#pins div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pdoc{display:none}
#sheet{position:absolute;inset:0;background:var(--bg);z-index:30;display:none;flex-direction:column}
#sheetBar{display:flex;gap:6px;align-items:center;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;flex-wrap:wrap}
#shName{font-size:13px;flex:1;min-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sheetBody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 10px 12px}
#sheetBody svg{max-width:100%;max-height:100%}
#shMsg{font-size:12px;color:var(--text2);padding:0 10px 8px}
#shTabs{display:flex;gap:4px;flex-wrap:wrap;padding:0 10px 8px}
#shTabs button{height:30px;min-width:34px;font-size:13px}
#shInfo{padding:0 10px 8px;font-size:13px;line-height:1.45;max-height:30%;overflow-y:auto}
#shInfo .kpl{color:var(--text2);font-size:12px}
#mvbar{position:absolute;top:calc(44px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;background:var(--surface);border:.5px solid var(--border);border-left:3px solid #EF9F27;border-radius:3px;padding:5px 6px 5px 9px;font-size:12px;z-index:7;max-width:calc(100% - 24px)}
#mvbar button{height:28px;font-size:12px}
.kp{margin:6px 0 0;padding-left:18px}
.kp li{margin:2px 0}
.dchip{font-size:12px;color:var(--text2);font-weight:400;margin-left:6px}
@media print{.ui,.pop,#trash,#lib,#hint,#info,#pins,#box{display:none!important}html,body{height:auto;overflow:visible;background:#fff;color:#000}#pdoc{display:block!important}
.pblk{page-break-inside:avoid;break-inside:avoid;margin:0 0 22px}
.pblk h2{font-size:15px;margin:0 0 2px;font-weight:600}
.pblk .pm{font-size:11px;color:#555;margin:0 0 6px}
.pblk ul{margin:7px 0 0;padding-left:18px;font-size:12px}
.pblk p{font-size:12px;line-height:1.5;margin:7px 0 0;white-space:pre-wrap}
#pdoc h1{font-size:18px;margin:0 0 3px}
#pdoc .ph{font-size:11px;color:#555;margin:0 0 14px}}
#trash{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border:2px dashed var(--danger);border-radius:4px;background:var(--surface);color:var(--danger);display:none;align-items:center;justify-content:center;z-index:4;pointer-events:none}
</style>
</head>

  var c=addItem(it.t,it.x+4,it.y+4,it.a,it.col);c.f=it.f?1:0;sel=c.id;
  hist.push({undo:function(){items=items.filter(function(i){return i!==c;});sel=null;render();}});
  render();dirty();
}

/* ---------- lines ---------- */
var PEN='#141414', PENW=0.25;
function smooth1(p){
  if(p.length<3)return p;
  var q=[p[0]];
  for(var i=1;i<p.length-1;i++)q.push([(p[i-1][0]+p[i][0]+p[i+1][0])/3,(p[i-1][1]+p[i][1]+p[i+1][1])/3]);
  q.push(p[p.length-1]);return q;
}
function smooth(p){
  for(var k=0;k<3;k++){var q=[p[0]];for(var i=1;i<p.length-1;i++)q.push([(p[i-1][0]+p[i][0]+p[i+1][0])/3,(p[i-1][1]+p[i][1]+p[i+1][1])/3]);q.push(p[p.length-1]);p=q;}
  return p;
}
function resample(p,step){
  var out=[p[0]],prevp=p[0],d=0;
  for(var i=1;i<p.length;i++){
    var seg=dist(prevp,p[i]);
    while(seg>0&&d+seg>=step){var t=(step-d)/seg;var np=[prevp[0]+(p[i][0]-prevp[0])*t,prevp[1]+(p[i][1]-prevp[1])*t];out.push(np);prevp=np;seg=dist(prevp,p[i]);d=0;}
    d+=seg;prevp=p[i];
  }
  if(dist(out[out.length-1],p[p.length-1])>0.05)out.push(p[p.length-1]);
  return out;
}
function nrm(a,i){var p=a[Math.max(0,i-1)],q=a[Math.min(a.length-1,i+1)];var dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||1;return [-dy/l,dx/l];}
function pstr(a){return a.map(function(p){return p[0].toFixed(2)+','+p[1].toFixed(2);}).join(' ');}
function offs(a,f){return a.map(function(p,i){var n=nrm(a,i),o=f(i);return [p[0]+n[0]*o,p[1]+n[1]*o];});}
function shotOff(s){var H=2.4,F=0.6;if(s>H+F)return 0.5;if(s>H)return 0.5+0.8*((H+F-s)/F);return 1.3*s/H;}
function build(l){
  var a=l.arr,n=a.length,g=el('g',{});
  var base={fill:'none',stroke:l.color,'stroke-width':0.5,'stroke-linecap':'round','stroke-linejoin':'round'};
  if(l.sel)g.appendChild(el('polyline',{points:pstr(a),fill:'none',stroke:'#378ADD','stroke-width':2.6,opacity:0.3,'stroke-linecap':'round','stroke-linejoin':'round'}));
  var attrs=Object.assign({},base);
  if(l.type==='skate'||l.type==='back'){attrs.points=pstr(a);g.appendChild(el('polyline',attrs));}
  if(l.type==='back'){
    var d='';for(var i=8;i<n-6;i+=9){var nr=nrm(a,i);d+='M'+(a[i][0]-nr[0]*0.8).toFixed(2)+' '+(a[i][1]-nr[1]*0.8).toFixed(2)+'L'+(a[i][0]+nr[0]*0.8).toFixed(2)+' '+(a[i][1]+nr[1]*0.8).toFixed(2);}
    if(d)g.appendChild(el('path',Object.assign({},base,{d:d})));
  }
  if(l.type==='puck'){
    var w=offs(a,function(i){var taper=Math.min(1,i/10,(n-1-i)/10);return 0.6*taper*Math.sin(i*0.4/4.2*2*Math.PI);});
    attrs.points=pstr(w);g.appendChild(el('polyline',attrs));
  }
  if(l.type==='pen'){attrs.points=pstr(a);attrs['stroke-width']=PENW;g.appendChild(el('polyline',attrs));return g;}
  if(l.type==='pass'){attrs.points=pstr(a);attrs['stroke-dasharray']='1.3 1.2';g.appendChild(el('polyline',attrs));}
  if(l.type==='shot'){
    var th=Object.assign({},base,{'stroke-width':0.35});
    th.points=pstr(offs(a,function(i){return shotOff((n-1-i)*l.step);}));g.appendChild(el('polyline',Object.assign({},th)));
    th.points=pstr(offs(a,function(i){return -shotOff((n-1-i)*l.step);}));g.appendChild(el('polyline',Object.assign({},th)));
    return g;
  }
  var E=a[n-1],B=a[Math.max(0,n-6)],ang=Math.atan2(E[1]-B[1],E[0]-B[0]),L=2.2;
  var h='M'+(E[0]-L*Math.cos(ang-0.5)).toFixed(2)+' '+(E[1]-L*Math.sin(ang-0.5)).toFixed(2)+'L'+E[0].toFixed(2)+' '+E[1].toFixed(2)+'L'+(E[0]-L*Math.cos(ang+0.5)).toFixed(2)+' '+(E[1]-L*Math.sin(ang+0.5)).toFixed(2);
  g.appendChild(el('path',Object.assign({},base,{d:h})));
  return g;
}
function redraw(l){var ng=build(l);if(l.g&&l.g.parentNode)ink.replaceChild(ng,l.g);else ink.appendChild(ng);l.g=ng;}
function deselect(){lines.forEach(function(l){if(l.sel){l.sel=false;redraw(l);}});}
function hit(p){
  for(var i=lines.length-1;i>=0;i--){var a=lines[i].arr,st=Math.max(1,Math.round(0.4/lines[i].step));for(var j=0;j<a.length;j+=st)if(dist(a[j],p)<3)return lines[i];}
  return null;
}
function pt(e){var q=svg.createSVGPoint();q.x=e.clientX;q.y=e.clientY;var r=q.matrixTransform(ink.getScreenCTM().inverse());return [r.x,r.y];}
function removeLine(l){
  var idx=lines.indexOf(l);if(idx<0)return;
  lines.splice(idx,1);if(l.g&&l.g.parentNode)ink.removeChild(l.g);
  hist.push({undo:function(){lines.splice(idx,0,l);l.sel=false;l.g=build(l);ink.appendChild(l.g);}});
  dirty();
}
function straight(){return ptype==='pass'||ptype==='shot';}

svg.addEventListener('pointerdown',function(e){
  if(e.pointerType==='pen')penSeen=true;
  if(e.pointerType==='touch'&&penSeen)return;
  if(act!==null)return;
  closeAll();
  var p=pt(e), g=e.target.closest?e.target.closest('[data-id]'):null;
  if(tool==='erase'){
    if(g)removeIcon(+g.getAttribute('data-id'));
    else{var h=hit(p);if(h)removeLine(h);}
    return;
  }
  if(tool==='select'){
    if(g){
      var it=byId(+g.getAttribute('data-id'));
      var hd=e.target.getAttribute('data-h');
      if(!hd&&lastTap&&lastTap.id===it.id&&e.timeStamp-lastTap.t<350){lastTap=null;dupIcon(it);return;}
      act=e.pointerId;svg.setPointerCapture(e.pointerId);deselect();
      if(hd&&it.id===sel){drag={m:'irot',it:it,a0:Math.atan2(p[1]-it.y,p[0]-it.x),a:it.a};}
      else{sel=it.id;overTrash=false;drag={m:'imv',it:it,last:p,dist:0,x0:it.x,y0:it.y};}
      hideUI(true);render();return;
    }
    if(sel!==null){sel=null;render();}
    deselect();
    var h2=hit(p);
    if(h2){h2.sel=true;redraw(h2);act=e.pointerId;svg.setPointerCapture(e.pointerId);drag={m:'lmv',l:h2,last:p,dx:0,dy:0};hideUI(true);}
    return;
  }
  act=e.pointerId;svg.setPointerCapture(e.pointerId);
  raw=[p];hideUI(true);
  prev=el('polyline',{points:pstr(raw),fill:'none',stroke:(ptype==='pen'?PEN:color),'stroke-width':(ptype==='pen'?PENW:0.35),opacity:0.6,'stroke-linecap':'round'});
  ink.appendChild(prev);
});
svg.addEventListener('pointermove',function(e){
  if(e.pointerId!==act)return;
  var p=pt(e);
  if(raw){if(straight())raw=[raw[0],p];else raw.push(p);prev.setAttribute('points',pstr(raw));return;}
  if(!drag)return;
  if(drag.m==='lmv'){
    var dx=p[0]-drag.last[0],dy=p[1]-drag.last[1];
    drag.l.arr=drag.l.arr.map(function(q){return [q[0]+dx,q[1]+dy];});
    drag.dx+=dx;drag.dy+=dy;drag.last=p;redraw(drag.l);
  } else if(drag.m==='imv'){
    var ex=p[0]-drag.last[0],ey=p[1]-drag.last[1];
    drag.dist+=Math.hypot(ex,ey);
    drag.it.x=clamp(drag.it.x+ex,0,200);drag.it.y=clamp(drag.it.y+ey,0,85);drag.last=p;render();trashCheck(e);
  } else if(drag.m==='irot'){
    var cur=Math.atan2(p[1]-drag.it.y,p[0]-drag.it.x);
    var a=drag.a+(cur-drag.a0)*180/Math.PI,sn=Math.round(a/15)*15;
    if(Math.abs(a-sn)<4)a=sn;
    drag.it.a=a;render();
  }
});
function up(e){
  if(e.pointerId!==act)return;
  act=null;hideUI(false);
  if(raw){
    ink.removeChild(prev);prev=null;
    var len=0;for(var i=1;i<raw.length;i++)len+=dist(raw[i-1],raw[i]);
    var arr=null,step=(ptype==='pen')?0.25:0.4;
    if(len>=(ptype==='pen'?0.5:3)&&raw.length>1){
      if(ptype==='pen'){arr=resample(smooth1(raw),step);}
      else if(ptype==='shot'){step=0.2;arr=resample([raw[0],raw[raw.length-1]],step);}
      else if(ptype==='pass'){arr=resample([raw[0],raw[raw.length-1]],step);}
      else if(raw.length>2)arr=resample(smooth(resample(raw,0.8)),step);
    }
    if(arr&&arr.length>(ptype==='pen'?1:3)){
      var l={type:ptype,color:(ptype==='pen'?PEN:color),arr:arr,step:step,sel:false,g:null};
      lines.push(l);redraw(l);
      hist.push({undo:function(){var k=lines.indexOf(l);if(k>=0)lines.splice(k,1);if(l.g&&l.g.parentNode)ink.removeChild(l.g);}});
      dirty();
    }
    raw=null;return;
  }
  if(drag){
    var d=drag;drag=null;
    if(d.m==='lmv'){if(d.dx||d.dy){hist.push({undo:function(){d.l.arr=d.l.arr.map(function(q){return [q[0]-d.dx,q[1]-d.dy];});redraw(d.l);}});dirty();}}
    else if(d.m==='imv'){
      trashEl.style.display='none';
      if(overTrash){overTrash=false;d.it.x=d.x0;d.it.y=d.y0;removeIcon(d.it.id);return;}
      if(d.dist<0.8){lastTap={id:d.it.id,t:e.timeStamp};}
      else{hist.push({undo:function(){d.it.x=d.x0;d.it.y=d.y0;render();}});dirty();}
    } else if(d.m==='irot'){
      if(d.it.a!==d.a){hist.push({undo:function(){d.it.a=d.a;render();}});dirty();}
    }
    render();
  }
}
svg.addEventListener('pointerup',up);
svg.addEventListener('pointercancel',up);

/* ---------- save a drill ---------- */
/* A drill is what sits inside the section you are looking at, so six drills
   laid out across one sheet save as six separate drills, not six copies of
   the whole sheet. A line belongs to the section its midpoint falls in. */
function inRect(v,x,y){return x>=v[0]-0.01&&x<=v[0]+v[2]+0.01&&y>=v[1]-0.01&&y<=v[1]+v[3]+0.01;}
function snapIn(m,k,fresh){
  var sn=snap(), v=views[m]&&views[m][k];
  if(!v)return sn;
  sn.lines=sn.lines.filter(function(l){
    var cx=0,cy=0;l.arr.forEach(function(p){cx+=p[0];cy+=p[1];});
    return inRect(v,cx/l.arr.length,cy/l.arr.length);
  });
  sn.items=sn.items.filter(function(i){return inRect(v,i.x,i.y);});
  sn.mode=m;sn.sub=k;
  if(fresh){sn.home={m:m,s:k};sn.xf={ax:1,ay:1,bx:0,by:0};}
  return sn;
}
function sectionSnap(){
  if(mode==='full'||!views[mode]||!views[mode][sub])return snap();
  return snapIn(mode,sub,false);
}
/* Looking at the whole sheet and tapping Save used to store the drill as a
   full-ice drill even when everything drawn sat inside one section — the
   drill was not stretched, it was just filed as a full sheet. Work out the
   tightest section that holds it all and offer that instead. */
function tightFit(){
  var b=contentBox(lines,items); if(!b)return null;
  var best=null, ba=1e9;
  ['sixth','quarter','center','half'].forEach(function(m){
    Object.keys(views[m]).forEach(function(k){
      var v=views[m][k], e=0.6;
      if(b[0]>=v[0]-e&&b[0]+b[2]<=v[0]+v[2]+e&&b[1]>=v[1]-e&&b[1]+b[3]<=v[1]+v[3]+e){
        var a=v[2]*v[3]; if(a<ba){ba=a;best={m:m,k:k};}
      }
    });
  });
  return best;
}
function fitText(f){
  if(!f)return '';
  if(f.m==='center')return 'Center ice';
  if(f.m==='sixth')return 'Sixth \u00b7 '+f.k;
  return (f.m==='half'?'Half \u00b7 ':'Quarter \u00b7 ')+f.k;
}
var svFit=null, svFull=false;
function saveSnap(){
  if(mode==='full'&&svFit&&!svFull){
    var sn=snapIn(svFit.m,svFit.k,false);
    if(!(sn.home&&sn.home.m===sn.mode&&sn.home.s===sn.sub)){sn.home={m:sn.mode,s:sn.sub};sn.xf=idXf();}
    return sn;
  }
  return sectionSnap();
}
function saveWhere(){return (mode==='full'&&svFit&&!svFull)?fitText(svFit):chipText();}
function svRender(){
  var sn=saveSnap(), nl=sn.lines.length, ni=sn.items.length;
  document.getElementById('svNote').textContent=
    'Saves the '+nl+' line'+(nl===1?'':'s')+' and '+ni+' icon'+(ni===1?'':'s')+' inside '+saveWhere()
    +(sn.mode==='full'?'.':'. Anything on the rest of the ice is left out.')
    +(DB.src&&ctx.k==='draft'?' This draft is a copy of “'+DB.src+'”, so pick a different name.':'');
  var row=document.getElementById('svFit');
  if(mode==='full'&&svFit){
    var on='style="background:var(--accent-bg);color:var(--accent-text)"';
    row.style.display='block';
    row.innerHTML='<p class="note" style="margin:0 0 4px">Everything you have drawn sits inside <b>'+esc(fitText(svFit))+'</b>. Saved that way it can still be moved to any other section later.</p>'+
      '<div class="btns"><button data-sv="sec" '+(svFull?'':on)+'>'+esc(fitText(svFit))+'</button><button data-sv="full" '+(svFull?on:'')+'>Whole sheet</button></div>';
  } else {row.style.display='none';row.innerHTML='';}
}
/* Split whatever is on the board into a plan, one section at a time, so a
   sheet drawn on the fly becomes a practice plan without saving six drills. */
function planFromBoard(lk){
  var L=PLANL[lk]; if(!L)return null;
  var np={id:uid(),name:stamp(),layout:lk,slots:emptySlots(L)}, n=0;
  L.keys.forEach(function(k,i){
    var sn=snapIn(L.m,k,true);
    if(!sn.lines.length&&!sn.items.length)return;
    np.slots[i]={src:null,name:'Drill '+(i+1),mod:true,snap:sn};n++;
  });
  if(!n)return null;
  DB.plans.unshift(np);persist();return np;
}
function nameTaken(n,except){return DB.drills.some(function(d){return d.id!==except&&d.name.trim().toLowerCase()===n.trim().toLowerCase();});}
document.getElementById('mSave').onclick=function(){
  closeAll();
  hideMv();
  svFull=false; svFit=(mode==='full')?tightFit():null;
  document.getElementById('svName').value=stamp();
  document.getElementById('svErr').style.display='none';
  svRender();
  document.getElementById('pSave').style.display='block';
};
document.getElementById('svFit').addEventListener('click',function(e){
  var t=e.target.closest('[data-sv]'); if(!t)return;
  svFull=(t.dataset.sv==='full'); svRender();
});
document.getElementById('svNo').onclick=closeAll;
document.getElementById('svGo').onclick=function(){
  var n=document.getElementById('svName').value.trim()||stamp();
  var er=document.getElementById('svErr');
  if(nameTaken(n)){er.textContent='A saved drill already has that name. Pick a different one.';er.style.display='block';return;}
  var sn=saveSnap();
  if(!sn.lines.length&&!sn.items.length){er.textContent='There is nothing inside '+saveWhere()+' to save.';er.style.display='block';return;}
  saveNow();
  DB.drills.unshift({id:uid(),name:n,saved:stamp(),snap:clone(sn)});
  if(ctx.k==='draft')DB.src=n;
  persist();closeAll();setStatus();
  document.getElementById('status').textContent='Saved “'+n+'” to the library';
};

/* ---------- thumbnails ---------- */
function snapThumb(s,x,y,w,h,portrait){
  var v=views[s.mode]&&views[s.mode][s.sub]?views[s.mode][s.sub]:views.full['Whole sheet'];
  var vx=v[0],vy=v[1],vw=v[2],vh=v[3],m=1;
  var rot=portrait?(vw>=vh):(vh>vw);
  var vb=rot?[-(vy+vh),vx,vh,vw]:[vx,vy,vw,vh];
  var o='<svg x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" viewBox="'+(vb[0]-m)+' '+(vb[1]-m)+' '+(vb[2]+2*m)+' '+(vb[3]+2*m)+'" style="display:block;flex:none"><g'+(rot?' transform="rotate(90)"':'')+'><use href="#rinkg"/>';
  s.items.forEach(function(i){o+='<g transform="'+itemXf(i,rot?90:0)+'"'+(i.col?' style="color:'+i.col+'"':'')+'><use href="#'+T[i.t].s+'" width="56" height="56"/></g>';});
  s.lines.forEach(function(l){o+='<polyline points="'+pstr(l.arr)+'" fill="none" stroke="'+l.color+'" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"/>';});
  return o+'</g></svg>';
}
function tsvg(s,w,h){return '<svg width="'+w+'" height="'+h+'" style="flex:none;display:block">'+snapThumb(s,0,0,w,h,false)+'</svg>';}

function startRename(t){
  var k=t.dataset.k,id=t.dataset.id;
  var obj=(k==='p')?getPlan(id):(k==='s')?((getPlan(id)||{slots:[]}).slots[+t.dataset.i]):getDrill(id);
  if(!obj)return;
  var inp=document.createElement('input');inp.value=obj.name;inp.maxLength=60;
  t.replaceWith(inp);inp.focus();inp.select();
  var done=false;
  function commit(){
    if(done)return;done=true;
    var n=inp.value.trim();
    if(n&&(k!=='d'||!nameTaken(n,obj.id)))obj.name=n;
    persist();renderLib();
  }
  inp.addEventListener('blur',commit);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')commit();if(e.key==='Escape'){done=true;renderLib();}});
  inp.addEventListener('click',function(e){e.stopPropagation();});
}
libIn.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,id=t.dataset.id;
  if(a==='rename'){e.stopPropagation();startRename(t);return;}
  LB.msg='';LB.err='';
  var pl=LB.plan?getPlan(LB.plan):null;
  if(a!=='deld')LB.del=null;
  if(a!=='delp')LB.delp=null;
  if(a!=='setl')LB.setl=null;
  if(a==='close'){lib.style.display='none';return;}
  else if(a==='sheet'){openSheet(pl);return;}
  else if(a==='pplan'){printPlan(pl,function(){LB.err='Printing isn\u2019t available in this view. Use View full sheet \u2192 Save image, or open the app in its own browser tab.';renderLib();});return;}
  else if(a==='delp'){
    if(LB.delp===id){DB.plans=DB.plans.filter(function(x){return x.id!==id;});
      if(ctx.k==='slot'&&ctx.p===id)ctx={k:'draft'};
      LB.delp=null;if(LB.plan===id){LB.scr='list';LB.plan=null;LB.slot=null;}persist();}
    else LB.delp=id;}
  else if(a==='tab'){LB.tab=t.dataset.v;LB.tagd=null;}
  else if(a==='favf'){LB.favOnly=!LB.favOnly;}
  else if(a==='chip'){var cv=t.dataset.v;LB.filt=LB.filt||[];var ci=LB.filt.indexOf(cv);if(ci<0)LB.filt.push(cv);else LB.filt.splice(ci,1);}
  else if(a==='clrf'){LB.q='';LB.filt=[];LB.favOnly=false;}
  else if(a==='fav'){var fd=getDrill(id);if(fd){fd.fav=!fd.fav;persist();}}
  else if(a==='tagd'){LB.tagd=(LB.tagd===id?null:id);}
  else if(a==='settag'){var td=getDrill(id);if(td){td.tags=Array.isArray(td.tags)?td.tags:[];var ti=td.tags.indexOf(t.dataset.v);if(ti<0)td.tags.push(t.dataset.v);else td.tags.splice(ti,1);persist();}}
  else if(a==='openplan'){LB.scr='plan';LB.plan=id;LB.slot=null;LB.picker=false;LB.saveAs=false;}
  else if(a==='newplan'){var lk=t.dataset.v||'sixth';
    var np={id:uid(),name:stamp(),layout:lk,slots:emptySlots(PLANL[lk])};
    DB.plans.unshift(np);persist();LB.scr='plan';LB.plan=np.id;LB.slot=null;}
  else if(a==='setl'){
    var nk=t.dataset.v, NL=PLANL[nk];
    if(NL&&(pl.layout||'sixth')!==nk){
      var kept=pl.slots.filter(Boolean), drop=Math.max(0,kept.length-NL.keys.length);
      if(drop&&LB.setl!==nk){LB.setl=nk;LB.err='Switching to '+NL.label.toLowerCase()+' leaves room for '+NL.keys.length+' drills, so '+drop+' would be dropped. Tap '+NL.label+' again to confirm.';}
      else{
        pl.layout=nk;
        pl.slots=NL.keys.map(function(k,i){var c=kept[i];return c?{src:c.src,name:c.name,mod:c.mod,snap:fitSnap(clone(c.snap),NL.m,k)}:null;});
        LB.slot=null;LB.setl=null;persist();
        LB.msg='Plan is now in '+NL.label.toLowerCase()+'.'+(drop?' '+drop+' drill'+(drop===1?'':'s')+' did not fit and '+(drop===1?'was':'were')+' removed.':'');
      }
    }
  }
  else if(a==='zoom'){openSheet(pl,+t.dataset.i);return;}
  else if(a==='boardplan'){
    var bp=planFromBoard(t.dataset.v);
    if(!bp)LB.err='There is nothing on the board to split into a plan.';
    else{LB.scr='plan';LB.plan=bp.id;LB.slot=null;
      LB.msg='Built from the board. Each section became its own drill in this plan \u2014 use Save as new drill on any of them to add it to your library.';}
  }
  else if(a==='back'){LB.scr='list';LB.tab='plans';LB.slot=null;LB.picker=false;LB.saveAs=false;}
  else if(a==='slot'){LB.slot=+t.dataset.i;LB.picker=false;LB.saveAs=false;}
  else if(a==='pick'){LB.picker=!LB.picker;}
  else if(a==='addd'){var d=getDrill(id),La=layoutOf(pl);
    pl.slots[LB.slot]={src:d.id,name:d.name,snap:fitSnap(clone(d.snap),La.m,La.keys[LB.slot]),mod:false};LB.picker=false;persist();}
  else if(a==='rmslot'){pl.slots[LB.slot]=null;LB.saveAs=false;persist();}
  else if(a==='saveas'){LB.saveAs=!LB.saveAs;}
  else if(a==='cancel'){LB.saveAs=false;}
  else if(a==='dosave'){
    var n=(document.getElementById('sn').value||'').trim()||stamp();
    if(nameTaken(n)){LB.err='A saved drill already has that name. Pick a different one.';}
    else{DB.drills.unshift({id:uid(),name:n,saved:stamp(),snap:clone(pl.slots[LB.slot].snap)});LB.saveAs=false;persist();LB.msg='Saved as a new drill, “'+esc(n)+'”. The original is unchanged.';}
  }
  else if(a==='editslot'){
    ctx={k:'slot',p:pl.id,i:LB.slot};loadSnap(clone(pl.slots[LB.slot].snap));setStatus();lib.style.display='none';return;
  }
  else if(a==='exp'){dlFile();}
  else if(a==='cpy'){var tx=exportText();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(tx).then(function(){LB.msg='Copied. Paste it into a message, or into Paste on another device.';renderLib();},function(){LB.err='Copy was blocked. Use Export file instead.';renderLib();});}else LB.err='Copy isn\u2019t available here. Use Export file instead.';}
  else if(a==='impf'){var fi=document.getElementById('fi');fi.onchange=function(){var fl=fi.files[0];if(!fl)return;var rd=new FileReader();rd.onload=function(){importText(rd.result);};rd.readAsText(fl);};fi.click();return;}
  else if(a==='impp'){LB.paste=!LB.paste;}
  else if(a==='doimp'){var pt=document.getElementById('pt');LB.paste=false;importText(pt?pt.value:'');return;}
  else if(a==='core'){var cd=getDrill(id);if(ADMIN&&cd){cd.core=!cd.core;persist();}}
  else if(a==='editd'){var ed=getDrill(id);if(!canEdit(ed)){LB.err='That is a core drill. Use Edit as new to make your own copy.';renderLib();return;}ctx={k:'drill',id:ed.id};loadSnap(clone(ed.snap));setStatus();lib.style.display='none';return;}
  else if(a==='deld'){if(!canEdit(getDrill(id))){LB.err='That is a core drill and cannot be deleted here.';renderLib();return;}
    if(LB.del===id){DB.drills=DB.drills.filter(function(d){return d.id!==id;});if(ctx.k==='drill'&&ctx.id===id)ctx={k:'draft'};LB.del=null;persist();}else LB.del=id;}
  else if(a==='opend'){
    var dd=getDrill(id);ctx={k:'draft'};DB.src=dd.name;DB.draft=clone(dd.snap);persist();loadSnap(clone(dd.snap));setStatus();
    document.getElementById('status').textContent='Editing a copy of “'+dd.name+'”';lib.style.display='none';return;
  }
  renderLib();
});

/* ---------- export / import ---------- */
function exportText(){return JSON.stringify({app:'hockey-whiteboard',v:1,seed:Date.now(),drills:DB.drills.map(function(d){return {name:d.name,saved:d.saved,core:!!d.core,tags:d.tags||[],fav:!!d.fav,snap:d.snap};}),plans:DB.plans.map(function(p){return {name:p.name,slots:p.slots.map(function(c){return c?{name:c.name,mod:!!c.mod,snap:c.snap}:null;})};})});}
function saveFile(name,data,ok,fail){
  var get=(window.claude&&window.claude.use)?window.claude.use('downloads'):Promise.resolve(null);
  get.then(function(d){
    if(d)return d.save({filename:name,data:data}).then(ok,function(e){if(!(e&&e.code==='declined'))fail();});
    var b=(data instanceof Blob)?data:new Blob([data]);
    var a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
    document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},800);ok();
  }).catch(fail);
}
function dlFile(){
  saveFile('hockey-drills-'+stamp().slice(0,10)+'.json',exportText(),
    function(){LB.err='';LB.msg='Exported. Keep the file as a backup or send it to another coach.';renderLib();},
    function(){LB.err='Saving a file isn’t available here. Use Copy instead.';renderLib();});
}
function slug(t){return (t||'drill').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,50)||'drill';}
function saveImage(){
  closeAll();sel=null;deselect();hideMv();render();
  var vb=svg.getAttribute('viewBox').split(/[\s,]+/).map(Number);
  var PPF=14, pw=Math.round(vb[2]*PPF), ph=Math.round(vb[3]*PPF);
  var k=Math.min(1,2600/Math.max(pw,ph));pw=Math.round(pw*k);ph=Math.round(ph*k);
  var c=svg.cloneNode(true);
  c.setAttribute('xmlns','http://www.w3.org/2000/svg');
  c.setAttribute('width',pw);c.setAttribute('height',ph);
  c.removeAttribute('id');c.removeAttribute('style');
  ['[data-h]','[data-del]','rect[stroke-dasharray="3 2"]'].forEach(function(q){
    Array.prototype.slice.call(c.querySelectorAll(q)).forEach(function(e){e.parentNode.removeChild(e);});});
  rasterize(new XMLSerializer().serializeToString(c),pw,ph,slug(curName())+'.png',
    function(){statusMsg('Image saved \u00b7 '+pw+'\u00d7'+ph);},
    function(){statusMsg('Saving an image isn\u2019t available here.');});
}
function rasterize(str,pw,ph,name,ok,fail){
  var img=new Image();
  img.onload=function(){
    var cv=document.createElement('canvas');cv.width=pw;cv.height=ph;
    var g=cv.getContext('2d');g.fillStyle='#ffffff';g.fillRect(0,0,pw,ph);
    g.drawImage(img,0,0,pw,ph);
    cv.toBlob(function(bl){if(!bl){fail();return;}saveFile(name,bl,ok,fail);},'image/png');
  };
  img.onerror=fail;
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(str);
}
function staticItem(i,wr){
  var t=T[i.t]; if(!t)return null;
  var pv=pvOf(i.t), g=el('g',{transform:'translate('+i.x+' '+i.y+')'});
  var rg=el('g',{transform:'rotate('+(t.up?-(wr||0):i.a)+') scale('+(S*(i.f?-1:1))+' '+S+') translate('+(-pv[0])+' '+(-pv[1])+')'});
  if(i.col)rg.style.color=i.col;
  rg.appendChild(el('use',{href:'#'+t.s,width:56,height:56}));
  g.appendChild(rg);
  if(t.l){var tx=el('text',{x:0,y:4*S,'text-anchor':'middle','font-size':(t.l.length>1||t.s==='gk'?8.8:9.6)*S,'font-weight':500,fill:'#fff','font-family':'sans-serif'});tx.textContent=t.l;g.appendChild(tx);}
  return g;
}
/* The plan drawn on the ice: the whole sheet with dividers, or one section. */
function sheetSvgEl(pl,sec){
  var L=layoutOf(pl), m=1.5;
  var v=(sec==null)?[0,0,200,85]:views[L.m][L.keys[sec]];
  var gm=(sec==null)?10:m;   /* gutter for the zone numbers outside the boards */
  var o=el('svg',{viewBox:(v[0]-m)+' '+(v[1]-gm)+' '+(v[2]+2*m)+' '+(v[3]+2*gm)});
  o.appendChild(el('use',{href:'#rinkg'}));
  [[65.5,90],[134.5,-90]].forEach(function(z){
    if((z[0]-3.57)>=v[0]-0.5&&(z[0]+3.57)<=v[0]+v[2]+0.5&&26.5>=v[1]-0.5&&58.5<=v[1]+v[3]+0.5)
      o.appendChild(el('use',{href:'#lg',transform:'translate('+z[0]+' 42.5) rotate('+z[1]+') translate(-16 -3.57)',opacity:0.5}));
  });
  var list=((sec==null)?pl.slots:[pl.slots[sec]]).filter(Boolean);
  list.forEach(function(c){c.snap.items.forEach(function(i){var n=staticItem(i,0);if(n)o.appendChild(n);});});
  list.forEach(function(c){c.snap.lines.forEach(function(l){
    try{o.appendChild(build({type:l.type,color:l.color,step:l.step||0.4,arr:l.arr,sel:false}));}catch(e){}});});
  if(sec==null){
    /* interior dividers only, drawn last so they sit above the drills, and
       pulled in to the middle 80% so each one stops short of the boards */
    var seen={};
    L.keys.forEach(function(k){
      var r=views[L.m][k];
      if(r[0]>0.1)seen['x'+r[0]+'_'+r[1]]=[r[0],r[1],r[0],r[1]+r[3]];
      if(r[0]+r[2]<199.9)seen['x'+(r[0]+r[2])+'_'+r[1]]=[r[0]+r[2],r[1],r[0]+r[2],r[1]+r[3]];
      if(r[1]>0.1)seen['y'+r[1]+'_'+r[0]]=[r[0],r[1],r[0]+r[2],r[1]];
      if(r[1]+r[3]<84.9)seen['y'+(r[1]+r[3])+'_'+r[0]]=[r[0],r[1]+r[3],r[0]+r[2],r[1]+r[3]];
    });
    Object.keys(seen).forEach(function(k){
      var d=seen[k], mx=(d[0]+d[2])/2, my=(d[1]+d[3])/2, q=0.8;
      o.appendChild(el('line',{x1:mx+(d[0]-mx)*q,y1:my+(d[1]-my)*q,x2:mx+(d[2]-mx)*q,y2:my+(d[3]-my)*q,
        stroke:'#0B0B0C','stroke-width':1.65,'stroke-linecap':'round'}));
    });
    L.keys.forEach(function(k,i){
      /* Numbers sit just outside the boards, centred on their zone: above for
         the near-side row, below for the far side. Amber on a dark outline so
         they read against a dark app background and against white on export. */
      var r=views[L.m][k];
      var above=(r[1]<0.1&&r[1]+r[3]>84.9)||((r[1]+r[3]/2)<42.5);
      var bx=r[0]+r[2]/2, by=above?-5.4:90.4;
      o.appendChild(el('circle',{cx:bx,cy:by,r:3.6,fill:'#EF9F27',stroke:'#101014','stroke-width':0.7}));
      var tx=el('text',{x:bx,y:by+1.85,'text-anchor':'middle','font-size':5.1,'font-weight':700,fill:'#17170F','font-family':'sans-serif'});
      tx.textContent=String(i+1);o.appendChild(tx);
    });
  }
  return o;
}

    items:hits.map(function(i){var q=g([i.x,i.y]);
      var np=(T[i.t]&&T[i.t].up)?{a:i.a,f:i.f?1:0}:mirrorPlace(i.a,i.f,m[0],m[1]);
      return {x:clamp(q[0],0,200),y:clamp(q[1],0,85),a:np.a,f:np.f};})};
}
function fitSnap(sn,m,su){
  var B=views[m]&&views[m][su];
  if(!B||!views[sn.mode]||!views[sn.mode][sn.sub])return sn;
  var home=okHome(sn.home,sn.mode,sn.sub);
  var r=moveGeom(sn.lines,sn.items,sn.xf,home,B);
  if(r){
    sn.lines.forEach(function(l,k){l.arr=r.lines[k];});
    sn.items.forEach(function(i,k){i.x=r.items[k].x;i.y=r.items[k].y;i.a=r.items[k].a;i.f=r.items[k].f;});
    sn.xf=r.xf;
  }
  sn.home=home; sn.mode=m; sn.sub=su; return sn;
}
var mvFrom=null, mvBar=document.getElementById('mvbar'), mvTimer=null;
function hideMv(){mvBar.style.display='none';mvFrom=null;clearTimeout(mvTimer);}
function offerMove(oldMode,oldSub){
  if(!lines.length&&!items.length)return;
  if(oldMode===mode&&oldSub===sub)return;
  var A=views[oldMode]&&views[oldMode][oldSub];if(!A)return;
  mvFrom=A;mvBar.style.display='flex';
  clearTimeout(mvTimer);mvTimer=setTimeout(hideMv,5000);
}
function goView(m,su){var om=mode,os=sub;mode=m;sub=su;paint();offerMove(om,os);}
document.getElementById('admNo').onclick=closeAll;
document.getElementById('admOff').onclick=function(){setAdmin(false);closeAll();statusMsg('Coach tools locked');};
document.getElementById('admGo').onclick=function(){
  if(document.getElementById('admCode').value===ADMIN_CODE){setAdmin(true);closeAll();statusMsg('Coach tools unlocked');}
  else document.getElementById('admNote').textContent='That code did not match.';
};
document.getElementById('mvno').onclick=hideMv;
document.getElementById('mvgo').onclick=function(){
  var B=views[mode][sub];hideMv();
  if(!B)return;
  dHome=okHome(dHome,mode,sub);
  var r=moveGeom(lines,items,dXf,dHome,B);
  if(!r)return;
  var oldL=lines.map(function(l){return l.arr;}), oldI=items.map(function(i){return [i.x,i.y,i.a,i.f];}), oldX=dXf;
  lines.forEach(function(l,k){l.arr=r.lines[k];redraw(l);});
  items.forEach(function(i,k){i.x=r.items[k].x;i.y=r.items[k].y;i.a=r.items[k].a;i.f=r.items[k].f;});
  dXf=r.xf;
  hist.push({undo:function(){
    dXf=oldX;
    lines.forEach(function(l,k){if(oldL[k]){l.arr=oldL[k];redraw(l);}});
    items.forEach(function(i,k){if(oldI[k]){i.x=oldI[k][0];i.y=oldI[k][1];i.a=oldI[k][2];i.f=oldI[k][3];}});
    render();
  }});
  render();dirty();
};
/* ---------- full screen ---------- */
function fsNote(){document.getElementById('status').textContent='Full screen isn\u2019t available in this view. The installed app will be full screen.';}
document.getElementById('fs').onclick=function(){closeAll();var d=document;try{if(d.fullscreenElement){d.exitFullscreen();}else if(d.documentElement.requestFullscreen){d.documentElement.requestFullscreen({navigationUI:'hide'}).catch(fsNote);}else fsNote();}catch(e){fsNote();}};
/* ---------- club drills ----------
   A drills.json uploaded next to the app becomes the starter library: a coach
   who installs gets the club's drills without importing anything, and they
   arrive locked so nobody edits the shared copies by accident.
   Running again only ADDS. A drill whose name is already in the library is
   left alone, so a coach never loses their own work when the club file
   is updated. Every export stamps itself, so a newer file is picked up and
   an older one is ignored — there is no version number to remember. */
function seedDrills(){
  if(location.protocol.indexOf('http')!==0)return;
  fetch('./drills.json',{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null;})
    .then(function(o){
      if(!o||!Array.isArray(o.drills))return;
      var ver=+o.seed||1;
      if((+DB.seed||0)>=ver)return;
      var added=0;
      o.drills.forEach(function(d){
        if(!d||!d.snap||!Array.isArray(d.snap.lines)||!Array.isArray(d.snap.items))return;
        var name=String(d.name||'').trim().slice(0,60);
        if(!name||nameTaken(name))return;
        DB.drills.push({id:uid(),name:name,saved:d.saved||stamp(),core:true,
                        tags:okTags(d.tags),fav:false,snap:cleanSnap(d.snap)});
        added++;
      });
      DB.seed=ver;
      DB.drills.forEach(function(d){brightenSnap(d.snap);});
      autoTagAll();persist();
      if(added){statusMsg(added+' club drill'+(added===1?'':'s')+' added');
        if(lib.style.display==='block')renderLib();}
    })
    .catch(function(){});
}

/* ---------- start ---------- */
loadDB();
seedDrills();
if(DB.draft)loadSnap(DB.draft);else paint();
ui();setStatus();drawPins();

  });
}
